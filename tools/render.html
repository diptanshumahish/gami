<!doctype html>
<meta charset="utf-8">
<title>bounce</title>
<body>
<pre id="log"></pre>
<script type="module">
import { audio } from '../src/core/audio.js';
import { STATION_IDS } from '../src/core/radio.js';

const log = (m) => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
const SR = 44100;
const FM_STATIONS = ['late_night', 'lofi', 'jazzhop', 'synthwave'];

/* Which pieces to bounce, and for how long. The slow ones need the
   time: `nine` is at 40 bpm in 4, so a bar is six seconds and the
   phrase library is sixteen bars long. */
const SCORE = [
  ['old_doll',       95],
  ['wash_rite',      85],
  ['small_hours',    95],
  ['snow',          100],
  ['nine',          105],
  ['doll_house',     95],
  ['ninth_hour',    105],
  ['nothing_to_say', 95]
];
const RADIO = [
  ['late_night', 95],
  ['jazzhop',    90],
  ['synthwave',  85],
  ['lofi',       90]
];

/** float PCM -> a 16-bit stereo WAV, which is what ffmpeg wants. */
function wav(buffer) {
  const n = buffer.length, ch = buffer.numberOfChannels;
  const L = buffer.getChannelData(0);
  const R = ch > 1 ? buffer.getChannelData(1) : L;
  const bytes = 44 + n * 4;
  const v = new DataView(new ArrayBuffer(bytes));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, bytes - 8, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 2, true); v.setUint32(24, SR, true);
  v.setUint32(28, SR * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 4, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    for (const C of [L, R]) {
      let x = Math.max(-1, Math.min(1, C[i]));
      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
      o += 2;
    }
  }
  return v.buffer;
}

/** Reset the singleton so each bounce gets a clean graph. */
function fresh(seconds) {
  audio.ctx = null; audio.ready = false;
  audio.music = null; audio.loops = new Map(); audio.radios = new Map();
  audio._occluders = []; audio._dryerOcc = null;
  return new OfflineAudioContext(2, Math.ceil(SR * seconds), SR);
}

/**
 * The schedulers in music.js and radio.js run on setInterval against
 * the wall clock, which does not advance inside an OfflineAudioContext.
 * Every note is scheduled at an absolute time, though, so the whole
 * take can simply be laid down in advance. Same note stream, no timer.
 */
function preroll(unit, seconds, meterOf) {
  clearInterval(unit.timer); unit.timer = null;
  let guard = 0;
  while (unit.nextTime < seconds && guard++ < 20000) {
    unit._bar(unit.nextTime);
    unit.nextTime += unit.beat * meterOf();
    if ('pieceBar' in unit) unit.pieceBar++; else unit.bar++;
  }
}

async function bounceScore(id, seconds) {
  const ctx = fresh(seconds);
  await audio.unlock({ context: ctx });
  audio.bus.master.gain.value = 1.0;
  audio.bus.music.gain.value = 1.0;
  const m = audio.music;
  m.setScene(id, { immediate: false });
  if (m.pending) m._swap();
  m.start();
  m.out.gain.cancelScheduledValues(0);
  m.out.gain.setValueAtTime(0.0001, 0);
  m.out.gain.exponentialRampToValueAtTime(1, 1.2);          // in
  m.out.gain.setValueAtTime(1, Math.max(1.3, seconds - 4));
  m.out.gain.exponentialRampToValueAtTime(0.0001, seconds); // and out
  m.pieceBar = 0; m.nextTime = 0.4;
  preroll(m, seconds, () => m.piece.meter);
  return { buf: await ctx.startRendering(), title: m.piece.title };
}

async function bounceRadio(id, seconds) {
  const ctx = fresh(seconds);
  await audio.unlock({ context: ctx });
  audio.bus.master.gain.value = 1.0;
  audio.bus.amb.gain.value = 1.0;
  // no panner: this is the set on its own, not the set across a room.
  // An FM station gets a speaker that can actually reproduce it; the
  // AM stations get the kitchen set, because that is the point of them.
  const r = audio.radio('bounce', {
    station: id, volume: 0.95, signal: 0.92, on: false,
    set: FM_STATIONS.includes(id) ? 'hifi' : 'table'
  });
  r.power(true);
  r.out.gain.cancelScheduledValues(0);
  r.out.gain.setValueAtTime(0.0001, 0);
  r.out.gain.exponentialRampToValueAtTime(0.95, 0.6);
  r.out.gain.setValueAtTime(0.95, Math.max(0.7, seconds - 3));
  r.out.gain.exponentialRampToValueAtTime(0.0001, seconds);
  r.bar = 0; r.nextTime = 0.35;
  preroll(r, seconds, () => r.station.meter);
  return { buf: await ctx.startRendering(), title: `${r.station.call} ${r.station.name}` };
}

const send = (name, title, buf) =>
  fetch('/save?name=' + encodeURIComponent(name) + '&title=' + encodeURIComponent(title),
    { method: 'POST', body: wav(buf) });

try {
  for (const [id, secs] of SCORE) {
    const { buf, title } = await bounceScore(id, secs);
    await send('score-' + id, title, buf);
    log('score  ' + id + '  ' + secs + 's  "' + title + '"');
  }
  for (const [id, secs] of RADIO) {
    const { buf, title } = await bounceRadio(id, secs);
    await send('radio-' + id, title, buf);
    log('radio  ' + id + '  ' + secs + 's  "' + title + '"');
  }
  await fetch('/done', { method: 'POST' });
} catch (e) {
  await fetch('/fail', { method: 'POST', body: String(e && e.stack || e) });
}
</script>
